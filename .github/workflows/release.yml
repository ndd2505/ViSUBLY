# Builds the Windows installer + portable app and publishes them as a GitHub Release.
# Trigger: push a tag like v1.0.1 (git tag v1.0.1 && git push origin v1.0.1),
# or run it manually from the Actions tab (artifacts only, no Release).
name: Release

on:
  push:
    tags: ["v*"]
    # Pushing a ci/* branch runs the same build (artifacts only, no Release) for diagnosis.
    branches: ["ci/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: |
          npm run check
          node scripts/test-capture-bridge.js
          node scripts/test-extension-streams.mjs
          node scripts/test-remote-pairing.js
          node scripts/test-video-enhance.js

      - name: Build installer and portable app
        shell: pwsh
        run: |
          npm run package:win:ci *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            # Surface the tail of the log as an annotation (readable on the run page / API).
            $tail = (Get-Content build.log -Tail 60 | ForEach-Object { $_ -replace '%', '%25' -replace "`r", '' }) -join '%0A'
            Write-Output "::error title=Build failed::$tail"
            exit 1
          }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter "ViSUBLY-*.exe" |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Path dist/SHA256SUMS.txt -Encoding utf8NoBOM
          Get-Content dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visubly-windows
          path: |
            dist/ViSUBLY-Setup-*.exe
            dist/ViSUBLY-Portable-*.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ViSUBLY ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            dist/ViSUBLY-Setup-*.exe
            dist/ViSUBLY-Portable-*.exe
            dist/SHA256SUMS.txt
